services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sol_auction
    ports:
      - "5432:5432"

  localstack:
    image: localstack/localstack:latest
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app:Z
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sol_auction
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-true}
      - DEV_SIGNER_KEYPAIR=${DEV_SIGNER_KEYPAIR:-}
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=4bid-files
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    ports:
      - "8000:8000"
    depends_on:
      - db
      - localstack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-true}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  localstack_data:
